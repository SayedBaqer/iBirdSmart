<title>iBird Hatching</title>
<style>
:root{
  --bg:#16110c;--panel:#241c14;--line:#3a2e22;--ink:#efe3cf;--muted:#a99a83;
  --heat:#f0a02a;--heat-d:#c97c14;--fast:#e7724a;--ok:#7bbf6a;--slow:#5aa9d6;
  --shell:#f3e9d6;--shell-ink:#2a2118;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom));}
a{color:var(--heat);}
button{font-family:inherit;cursor:pointer;border:none;}
input,select,textarea{font-family:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;width:100%;}
label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin:14px 0 6px;}
.field:first-child label{margin-top:0;}

#updateBar{display:none;position:fixed;top:0;left:0;right:0;background:var(--heat);color:#251603;padding:10px 16px;font-size:13px;font-weight:700;z-index:200;align-items:center;justify-content:space-between;gap:10px;}
#updateBar button{background:#251603;color:var(--heat);border-radius:8px;padding:7px 12px;font-weight:700;}

header{padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:17px;letter-spacing:.08em;font-weight:700;margin:0;}
header .tag{font-size:10.5px;letter-spacing:.22em;color:var(--heat);text-transform:uppercase;margin-top:2px;font-weight:600;}
.langbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 13px;font-size:13px;font-weight:700;}

main{padding:0 16px 20px;max-width:640px;margin:0 auto;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
.card h2{font-size:15px;margin:0 0 12px;font-weight:700;}
.muted{color:var(--muted);font-size:13px;}
.row{display:flex;gap:10px;}
.row>*{flex:1;}

.pill{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:999px;}
.pill.incubating{background:rgba(90,169,214,.15);color:var(--slow);}
.pill.lockdown{background:rgba(240,160,42,.18);color:var(--heat);}
.pill.hatching{background:rgba(123,191,106,.18);color:var(--ok);}
.pill.complete{background:rgba(169,154,131,.18);color:var(--muted);}

.batch{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:rgba(0,0,0,.12);cursor:pointer;}
.batch .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.batch .name{font-weight:700;font-size:15px;}
.batch .meta{font-size:12.5px;color:var(--muted);}
.batch .stats{display:flex;gap:16px;margin-top:10px;font-family:ui-monospace,Consolas,monospace;}
.batch .stats div b{display:block;font-size:15px;color:var(--ink);}
.batch .stats div span{font-size:10.5px;color:var(--muted);text-transform:uppercase;}

.event{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.event:last-child{border-bottom:none;}
.event .lbl{font-weight:600;}
.event .date{color:var(--muted);font-size:12px;white-space:nowrap;}
.event.today .lbl{color:var(--heat);}
.event.today .date{color:var(--heat);font-weight:700;}

.btn{background:var(--heat);color:#251603;font-weight:800;border-radius:12px;padding:13px 16px;font-size:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600;}
.btn.small{width:auto;padding:9px 14px;font-size:13px;}
.btn.danger{background:transparent;color:var(--fast);border:1px solid rgba(231,114,74,.5);}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:100;}
nav button{flex:1;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:10.5px;font-weight:700;border-radius:10px;}
nav button.active{color:var(--heat);}
nav button .ic{font-size:19px;}

.modalwrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:150;}
.modalwrap.open{display:flex;}
.modal{background:var(--bg);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:88vh;overflow-y:auto;}
.modal h2{margin:0 0 4px;font-size:17px;}
.modal .close{position:absolute;top:16px;inset-inline-end:16px;background:var(--panel);border-radius:10px;width:34px;height:34px;color:var(--muted);font-size:16px;}
.modalhead{position:relative;margin-bottom:14px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:start;padding:6px 6px;font-weight:700;border-bottom:1px solid var(--line);}
td{padding:8px 6px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}

.metric{text-align:center;padding:12px 6px;}
.metric b{display:block;font-size:19px;font-family:ui-monospace,Consolas,monospace;color:var(--heat);}
.metric span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--shell);color:var(--shell-ink);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:220;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center;}
.toast.show{opacity:1;}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--ink);}
.chip.active{background:var(--heat);color:#251603;border-color:var(--heat);}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px;}

.hero{padding:8px 4px 22px;text-align:center;}
.hero .emoji{font-size:46px;display:block;margin-bottom:12px;}
.hero h2{font-size:21px;margin:0 0 8px;}
.hero p{color:var(--muted);font-size:13.5px;line-height:1.65;margin:0 auto 22px;max-width:420px;}
.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;text-align:start;}
.feature{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;padding:14px;}
.feature .ic{font-size:19px;display:block;margin-bottom:6px;}
.feature b{display:block;font-size:13px;margin-bottom:3px;}
.feature span{font-size:11.5px;color:var(--muted);line-height:1.45;display:block;}
.feature:last-child:nth-child(odd){grid-column:1/-1;}
</style>
</head>

<script>
var _swReg=null;
function showUpdateBar(){ document.getElementById('updateBar').style.display='flex'; }
function trackInstalling(sw){
  sw.addEventListener('statechange',function(){
    if(sw.state==='installed'&&navigator.serviceWorker.controller) showUpdateBar();
  });
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    _swReg=reg;
    if(reg.waiting&&navigator.serviceWorker.controller) showUpdateBar();
    if(reg.installing) trackInstalling(reg.installing);
    reg.addEventListener('updatefound',function(){ trackInstalling(reg.installing); });
    document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') reg.update(); });
    reg.update();
  }).catch(function(){});
}
function applyUpdate(){
  document.getElementById('updateBar').style.display='none';
  var doReload=function(){ window.location.reload(); };
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('controllerchange',doReload);
    (_swReg&&_swReg.waiting ? Promise.resolve(_swReg) : navigator.serviceWorker.ready).then(function(reg){
      if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'}); else doReload();
    });
  } else { doReload(); }
}

/* ---------- date helpers ---------- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/86400000); }
function fmtDate(iso){ if(!iso) return t('notSet'); const d=new Date(iso+'T00:00:00Z'); return d.toLocaleDateString(LANG==='ar'?'ar-BH':'en-GB',{day:'numeric',month:'short',timeZone:'UTC'}); }

/* ---------- schedule derivation (§4 of the dev plan) ---------- */
function computeSchedule(batch){
  const sp=speciesById(batch.speciesId);
  const today=todayISO();
  const dayNum=daysBetween(batch.setDate,today);
  const lockDay=sp.incubationDays-sp.lockdownOffsetDays;
  const hatchDay=sp.incubationDays;
  const hatchBufferDays=Math.ceil(sp.hatchSpreadHours/24);

  let status;
  if(batch.manualComplete) status='complete';
  else if(dayNum<lockDay) status='incubating';
  else if(dayNum<hatchDay) status='lockdown';
  else if(dayNum<hatchDay+hatchBufferDays+3) status='hatching';
  else status='complete';

  const events=[];
  events.push({key:'candling1',label:t('eventCandling1'),date:addDays(batch.setDate,sp.candlingDays[0])});
  events.push({key:'candling2',label:t('eventCandling2'),date:addDays(batch.setDate,sp.candlingDays[1])});
  events.push({key:'lockdownWarn',label:t('eventLockdownWarn'),date:addDays(batch.setDate,lockDay-1)});
  events.push({key:'lockdownDay',label:t('eventLockdownDay'),date:addDays(batch.setDate,lockDay)});
  events.push({key:'dnd',label:t('eventDND'),date:addDays(batch.setDate,lockDay+1)});
  events.push({key:'hatchWarn',label:t('eventHatchWarn'),date:addDays(batch.setDate,hatchDay-1)});
  events.push({key:'hatchStart',label:t('eventHatchStart'),date:addDays(batch.setDate,hatchDay)});
  if(batch.firstHatchAt){
    events.push({key:'chickRemoval',label:t('eventChickRemoval'),date:addDays(batch.firstHatchAt,Math.ceil(sp.chickRemovalHours/24))});
  }
  const fertileUnknownOrRemaining=(batch.eggsFertile==null)||(batch.eggsHatched==null)||(batch.eggsHatched<batch.eggsFertile);
  if(fertileUnknownOrRemaining && status!=='complete'){
    events.push({key:'stalled',label:t('eventStalled'),date:addDays(batch.setDate,hatchDay+hatchBufferDays+2)});
  }
  events.sort((a,b)=>a.date<b.date?-1:1);

  return {sp,dayNum,lockDay,hatchDay,status,events,today};
}

function metricsFor(batch){
  const m={};
  if(batch.eggsFertile!=null && batch.eggsSet>0) m.fertility=(batch.eggsFertile/batch.eggsSet*100);
  if(batch.eggsHatched!=null && batch.eggsSet>0) m.hos=(batch.eggsHatched/batch.eggsSet*100);
  if(batch.eggsHatched!=null && batch.eggsFertile>0) m.hof=(batch.eggsHatched/batch.eggsFertile*100);
  const incubator=incubators.find(i=>i.id===batch.incubatorId);
  const sp=speciesById(batch.speciesId);
  let powerCost=null;
  if(incubator && incubator.ratedPowerWatts){
    const kwh=(incubator.ratedPowerWatts/1000)*sp.incubationDays*24;
    powerCost=kwh*(settings.electricityRate||0);
  }
  m.powerCost=powerCost;
  if(batch.eggsHatched>0){
    const total=(batch.eggCostTotal||0)+(powerCost||0)+(batch.otherCosts||0);
    m.costPerChick=total/batch.eggsHatched;
  }
  return m;
}

        html+=`<div class="batch" onclick="openBatchDetail('${b.id}')">

    html+=`</div>`;

function openBatchDetail(batchId){
  const b=batches.find(x=>x.id===batchId);
  if(!b) return;
  const sc=computeSchedule(b);
  const todayIso=sc.today;
  let evHtml=sc.events.map(ev=>`<div class="event ${ev.date===todayIso?'today':''}"><span class="lbl">${ev.label}</span><span class="date">${fmtDate(ev.date)}</span></div>`).join('');
  openModal(`
    <div class="modalhead"><h2>${t(sc.sp.nameKey)}</h2><div class="muted">${t('dayOf',{d:Math.max(sc.dayNum,0),n:sc.sp.incubationDays})}</div>
      <button class="close" onclick="closeModal()">✕</button></div>
    <div class="card" style="margin:14px 0 10px">${evHtml}</div>
    <div class="row">
      <button class="btn ghost" onclick="closeModal();setTab('eggtest')">${t('navEggTest')}</button>
      <button class="btn ghost" onclick="markComplete('${b.id}')">${t('markComplete')}</button>
    </div>
    <button class="btn danger" style="margin-top:10px" onclick="deleteBatch('${b.id}')">${t('delete')}</button>
  `);
}
function markComplete(batchId){
  const b=batches.find(x=>x.id===batchId); if(!b) return;
  b.manualComplete=true; saveBatches(); closeModal(); renderAll(); toast(t('toastSaved'));
}
function deleteBatch(batchId){
  if(!confirm(t('confirmDelete'))) return;
  batches=batches.filter(b=>b.id!==batchId); saveBatches(); closeModal(); renderAll(); toast(t('toastDeleted'));
}

    incubatorId:document.getElementById('f_batchInc').value,
    speciesId:document.getElementById('f_batchSpecies').value,
    setDate:document.getElementById('f_batchDate').value||todayISO(),
    trackingMode:'normal',
    eggsSet, eggsFertile:null, eggsHatched:null, firstHatchAt:null,
    eggCostTotal:0, otherCosts:0,

  });

  html+=`<div class="card"><h2>${t('metricsFertility')} / ${t('metricsHOS')} / ${t('metricsHOF')}</h2>
    <div class="row">
      <div class="metric"><b>${m.fertility!=null?m.fertility.toFixed(1)+'%':t('notSet')}</b><span>${t('metricsFertility')}</span></div>
      <div class="metric"><b>${m.hos!=null?m.hos.toFixed(1)+'%':t('notSet')}</b><span>${t('metricsHOS')}</span></div>
      <div class="metric"><b>${m.hof!=null?m.hof.toFixed(1)+'%':t('notSet')}</b><span>${t('metricsHOF')}</span></div>
    </div></div>`;

  html+=`<div class="card"><h2>${t('metricsCostPerChick')}</h2>
    <div class="row">
      <div class="field"><label>${t('fieldEggCost')}</label><input id="f_costEgg" type="number" value="${b.eggCostTotal||0}" onchange="updateCosts('${b.id}')"></div>
      <div class="field"><label>${t('fieldOtherCosts')}</label><input id="f_costOther" type="number" value="${b.otherCosts||0}" onchange="updateCosts('${b.id}')"></div>
    </div>
    <div class="row">
      <div class="field"><label>${t('fieldElectricityRate')}</label><input id="f_elecRate" type="number" step="0.001" value="${settings.electricityRate}" onchange="updateSettingsRate()"></div>
      <div class="field"><label>${t('fieldCurrency')}</label><input id="f_currency" value="${settings.currency}" onchange="updateSettingsCurrency()"></div>
    </div>
    <div class="note">${t('powerCostEstimate')}: ${m.powerCost!=null?m.powerCost.toFixed(2)+' '+settings.currency:t('notSet')}</div>
    <div class="metric" style="margin-top:6px"><b>${m.costPerChick!=null?m.costPerChick.toFixed(2)+' '+settings.currency:t('notSet')}</b><span>${t('metricsCostPerChick')}</span></div>
  </div>`;

  return html;
}
function selectEggTestBatch(id){ EGGTEST_SELECTED=id; renderView(); }
function updateCosts(batchId){
  const b=batches.find(x=>x.id===batchId); if(!b) return;
  b.eggCostTotal=parseFloat(document.getElementById('f_costEgg').value)||0;
  b.otherCosts=parseFloat(document.getElementById('f_costOther').value)||0;
  saveBatches(); renderView();
}
function updateSettingsRate(){ settings.electricityRate=parseFloat(document.getElementById('f_elecRate').value)||0; saveSettings(); renderView(); }
function updateSettingsCurrency(){ settings.currency=document.getElementById('f_currency').value||'BHD'; saveSettings(); renderView(); }

function openCandleModal(batchId,round){
  const b=batches.find(x=>x.id===batchId); if(!b) return;
  const defaultVal=round===1?b.eggsSet:(b.eggsFertile!=null?b.eggsFertile:b.eggsSet);
  openModal(`
    <div class="modalhead"><h2>${round===1?t('candleModalTitle1'):t('candleModalTitle2')}</h2><button class="close" onclick="closeModal()">✕</button></div>
    <div class="muted">${round===1?t('candleHint1'):t('candleHint2')}</div>
    <div class="field"><label>${t('fieldEggsFertile')}</label><input id="f_candleFertile" type="number" inputmode="numeric" value="${defaultVal}"></div>
    <button class="btn" style="margin-top:16px" onclick="saveCandle('${b.id}')">${t('save')}</button>
  `);
}
function saveCandle(batchId){
  const b=batches.find(x=>x.id===batchId); if(!b) return;
  const v=parseInt(document.getElementById('f_candleFertile').value,10);
  if(isNaN(v)||v<0) return;
  b.eggsFertile=v;
  saveBatches(); closeModal(); renderAll(); toast(t('toastSaved'));
}
function openHatchModal(batchId){
  const b=batches.find(x=>x.id===batchId); if(!b) return;
  const defaultVal=b.eggsFertile!=null?b.eggsFertile:b.eggsSet;
  openModal(`
    <div class="modalhead"><h2>${t('hatchModalTitle')}</h2><button class="close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>${t('fieldEggsHatched')}</label><input id="f_hatched" type="number" inputmode="numeric" value="${b.eggsHatched!=null?b.eggsHatched:defaultVal}"></div>
    <div class="field"><label>${t('fieldFirstHatchDate')}</label><input id="f_firstHatch" type="date" value="${b.firstHatchAt||todayISO()}"></div>
    <button class="btn" style="margin-top:16px" onclick="saveHatch('${b.id}')">${t('save')}</button>
  `);
}
function saveHatch(batchId){
  const b=batches.find(x=>x.id===batchId); if(!b) return;
  const v=parseInt(document.getElementById('f_hatched').value,10);
  if(isNaN(v)||v<0) return;
  b.eggsHatched=v;
  b.firstHatchAt=document.getElementById('f_firstHatch').value||todayISO();
  saveBatches(); closeModal(); renderAll(); toast(t('toastSaved'));
}

/* ---------- Guidance branch (§1a #2, §5a) ---------- */
function viewGuidance(){
  let html=`<div class="card"><h2>${t('guideTitle')}</h2><div class="muted" style="margin-bottom:6px">${t('guideIntro')}</div>`;
  for(let i=1;i<=7;i++){
    html+=`<div class="event"><div><div class="lbl">${t('guide'+i+'_t')}</div><div class="muted">${t('guide'+i+'_d')}</div></div></div>`;
  }
  html+=`</div>`;

  html+=`<div class="card"><h2>${t('guidanceHeader')}</h2>`;
  const todayIso=todayISO();
  let anyToday=false;
  batches.filter(b=>!b.manualComplete).forEach(b=>{
    const sc=computeSchedule(b);
    const todaysEvents=sc.events.filter(ev=>ev.date===todayIso);
    if(todaysEvents.length===0) return;
    anyToday=true;
    const sp=sc.sp;
    todaysEvents.forEach(ev=>{
      const guideKey='guidance_'+({candling1:'candle',candling2:'candle',lockdownWarn:'lockdownWarn',lockdownDay:'lockdownDay',dnd:'dnd',hatchWarn:'hatchWarn',hatchStart:'hatchStart',chickRemoval:'removal',stalled:'stalled'}[ev.key]||'incubating');
      html+=`<div class="batch" onclick="openBatchDetail('${b.id}')">
        <div class="top"><div class="name">${t(sp.nameKey)}</div><span class="pill ${sc.status}">${ev.label}</span></div>
        <div class="meta">${t(guideKey)}</div>
      </div>`;
    });
  });
  if(!anyToday) html+=`<div class="muted">${t('guidanceEmpty')}</div>`;
  html+=`</div>`;

  html+=`<div class="card"><h2>${t('troubleshootTitle')}</h2>
    <div class="event"><div><div class="lbl">${t('tr_lowFertility_t')}</div><div class="muted">${t('tr_lowFertility_d')}</div></div></div>
    <div class="event"><div><div class="lbl">${t('tr_lowHOF_t')}</div><div class="muted">${t('tr_lowHOF_d')}</div></div></div>
    <div class="event"><div><div class="lbl">${t('tr_stalled_t')}</div><div class="muted">${t('tr_stalled_d')}</div></div></div>
    <div class="event"><div><div class="lbl">${t('tr_tempSpike_t')}</div><div class="muted">${t('tr_tempSpike_d')}</div></div></div>
    <div class="note">${t('tr_principle')}</div>
  </div>`;

  html+=notifCard();
  return html;
}

/* ---------- Info branch (§7) ---------- */
function viewInfo(){
  let html=`<div class="card"><h2>${t('infoTitle')}</h2><div class="muted">${t('infoIntro')}</div></div>`;
  SPECIES.forEach(sp=>{
    html+=`<div class="card"><h2>${t(sp.nameKey)}</h2>
      <table>
        <tr><td class="muted">${t('infoIncubationDays')}</td><td>${sp.incubationDays} ${LANG==='ar'?'يوم':'days'}</td></tr>
        <tr><td class="muted">${t('infoTempForced')}</td><td>${sp.tempForced}°C</td></tr>
        <tr><td class="muted">${t('infoTempStill')}</td><td>${sp.tempStill}°C</td></tr>
        <tr><td class="muted">${t('infoHumidityPre')}</td><td>${sp.humidityPre}</td></tr>
        <tr><td class="muted">${t('infoHumidityLock')}</td><td>${sp.humidityLock}</td></tr>
        <tr><td class="muted">${t('infoTurning')}</td><td>${sp.turning}</td></tr>
        <tr><td class="muted">${t('infoLockdownOffset')}</td><td>${t('daysBeforeHatch',{n:sp.lockdownOffsetDays})}</td></tr>
        <tr><td class="muted">${t('infoCandlingDays')}</td><td>${LANG==='ar'?'اليوم':'day'} ${sp.candlingDays[0]}, ${sp.candlingDays[1]}</td></tr>
      </table>
    </div>`;
  });
  return html;
}

/* ---------- Store branch (§1a #5) ---------- */
function viewStore(){
  let html=`<div class="card"><h2>${t('storeTitle')}</h2><div class="muted">${t('storeDesc')}</div>`;
  if(settings.storeUrl){
    html+=`<a class="btn" style="margin-top:14px;text-decoration:none" href="${escapeHtml(settings.storeUrl)}" target="_blank" rel="noopener">${t('storeGoBtn')}</a>`;
  } else {
    html+=`<div class="note">${t('storeNotSet')}</div>`;
  }
  html+=`</div>
  <div class="card">
    <div class="field"><label>${t('storeUrlField')}</label><input id="f_storeUrl" value="${escapeHtml(settings.storeUrl||'')}" placeholder="https://"></div>
    <button class="btn ghost small" style="margin-top:10px" onclick="saveStoreUrl()">${t('storeSave')}</button>
  </div>`;
  return html;
}
function saveStoreUrl(){
  settings.storeUrl=document.getElementById('f_storeUrl').value.trim();
  saveSettings(); renderView(); toast(t('toastSaved'));
}

/* ---------- best-effort local notifications ---------- */
function notifCard(){
  const perm=('Notification' in window)?Notification.permission:'unsupported';
  let btn='';
  if(perm==='granted') btn=`<span class="pill hatching">${t('notifEnabled')}</span>`;
  else if(perm==='denied') btn=`<div class="muted">${t('notifDenied')}</div>`;
  else btn=`<button class="btn ghost small" onclick="requestNotifPermission()">${t('notifEnable')}</button>`;
  return `<div class="card"><h2>🔔</h2>${btn}<div class="note">${t('notifLimitationNote')}</div></div>`;
}
function requestNotifPermission(){
  if(!('Notification' in window)) return;
  Notification.requestPermission().then(()=>renderView());
}
function checkDueNotifications(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const todayIso=todayISO();
  const shown=load('ibird_notif_shown',{});
  batches.filter(b=>!b.manualComplete).forEach(b=>{
    const sc=computeSchedule(b);
    sc.events.filter(ev=>ev.date===todayIso).forEach(ev=>{
      const key=b.id+'_'+ev.key+'_'+ev.date;
      if(shown[key]) return;
      try{ new Notification(t('appTitle'),{body:ev.label,icon:'./icons/icon.svg'}); }catch(e){}
      shown[key]=true;
    });
  });
  save('ibird_notif_shown',shown);
}

/* ---------- modal / toast helpers ---------- */
function openModal(html){
  document.getElementById('modalBody').innerHTML=html;
  document.getElementById('modalwrap').classList.add('open');
}
function closeModal(){ document.getElementById('modalwrap').classList.remove('open'); }
document.getElementById('modalwrap').addEventListener('click',(e)=>{ if(e.target.id==='modalwrap') closeModal(); });
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- init ---------- */
applyLangAttrs();
renderAll();
checkDueNotifications();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkDueNotifications(); });
</script>
