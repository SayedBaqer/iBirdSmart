<style>

  font-family:'Cairo';font-style:normal;font-weight:400 800;font-display:swap;

}
@font-face{
  font-family:'Cairo';font-style:normal;font-weight:400 800;font-display:swap;
  src:url('./fonts/cairo-latin.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215;
}
:root{
  --bg:#16110c;--panel:#241c14;--line:#3a2e22;--ink:#efe3cf;--muted:#a99a83;
  --heat:#f0a02a;--heat-d:#c97c14;--fast:#e7724a;--ok:#7bbf6a;--slow:#5aa9d6;
  --shell:#f3e9d6;--shell-ink:#2a2118;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Cairo',-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh;}
a{color:var(--heat);}
button{font-family:inherit;cursor:pointer;border:none;}
input,select,textarea{font-family:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;width:100%;}
label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin:14px 0 6px;}
.field:first-child label{margin-top:0;}

#updateBar{display:none;position:fixed;top:0;left:0;right:0;background:var(--heat);color:#251603;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;font-size:13px;font-weight:700;z-index:200;align-items:center;justify-content:space-between;gap:10px;}
#updateBar button{background:#251603;color:var(--heat);border-radius:8px;padding:7px 12px;font-weight:700;}

header{padding:calc(18px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:17px;letter-spacing:.08em;font-weight:700;margin:0;}
header .tag{font-size:10.5px;letter-spacing:.22em;color:var(--heat);text-transform:uppercase;margin-top:2px;font-weight:600;}
.langbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 13px;font-size:13px;font-weight:700;}

main{padding:0 16px 20px;max-width:640px;margin:0 auto;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
.card h2{font-size:15px;margin:0 0 12px;font-weight:700;}
.muted{color:var(--muted);font-size:13px;}
.row{display:flex;gap:10px;}
.row>*{flex:1;}

.pill{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:999px;}
.pill.incubating{background:rgba(90,169,214,.15);color:var(--slow);}
.pill.lockdown{background:rgba(240,160,42,.18);color:var(--heat);}
.pill.hatching{background:rgba(123,191,106,.18);color:var(--ok);}
.pill.complete{background:rgba(169,154,131,.18);color:var(--muted);}
.pill.ok{background:rgba(123,191,106,.18);color:var(--ok);}
.pill.fast{background:rgba(231,114,74,.18);color:var(--fast);}
.pill.slow{background:rgba(90,169,214,.18);color:var(--slow);}
.pill.wait{background:rgba(169,154,131,.18);color:var(--muted);}

.batch{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:rgba(0,0,0,.12);cursor:pointer;}
.batch .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.batch .name{font-weight:700;font-size:15px;}
.batch .meta{font-size:12.5px;color:var(--muted);}
.batch .stats{display:flex;gap:16px;margin-top:10px;font-family:ui-monospace,Consolas,monospace;}
.batch .stats div b{display:block;font-size:15px;color:var(--ink);}
.batch .stats div span{font-size:10.5px;color:var(--muted);text-transform:uppercase;}

.event{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.event:last-child{border-bottom:none;}
.event .lbl{font-weight:600;}
.event .date{color:var(--muted);font-size:12px;white-space:nowrap;}
.event.today .lbl{color:var(--heat);}
.event.today .date{color:var(--heat);font-weight:700;}

.btn{background:var(--heat);color:#251603;font-weight:800;border-radius:12px;padding:13px 16px;font-size:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600;}
.btn.small{width:auto;padding:9px 14px;font-size:13px;}
.btn.danger{background:transparent;color:var(--fast);border:1px solid rgba(231,114,74,.5);}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:100;}
nav button{flex:1;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:10.5px;font-weight:700;border-radius:10px;}
nav button.active{color:var(--heat);}
nav button .ic{font-size:19px;}

.modalwrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:150;}
.modalwrap.open{display:flex;}
.modal{background:var(--bg);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:88vh;overflow-y:auto;}
.modal h2{margin:0 0 4px;font-size:17px;}
.modal .close{position:absolute;top:16px;inset-inline-end:16px;background:var(--panel);border-radius:10px;width:34px;height:34px;color:var(--muted);font-size:16px;}
.modalhead{position:relative;margin-bottom:14px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:start;padding:6px 6px;font-weight:700;border-bottom:1px solid var(--line);}
td{padding:8px 6px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}

.metric{text-align:center;padding:12px 6px;}
.metric b{display:block;font-size:19px;font-family:ui-monospace,Consolas,monospace;color:var(--heat);}
.metric span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--shell);color:var(--shell-ink);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:220;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center;}
.toast.show{opacity:1;}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--ink);}
.chip.active{background:var(--heat);color:#251603;border-color:var(--heat);}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px;}

.hero{padding:8px 4px 22px;text-align:center;}
.hero .emoji{font-size:46px;display:block;margin-bottom:12px;}
.hero h2{font-size:21px;margin:0 0 8px;}
.hero p{color:var(--muted);font-size:13.5px;line-height:1.65;margin:0 auto 22px;max-width:420px;}
.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;text-align:start;}
.feature{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;padding:14px;}
.feature .ic{font-size:19px;display:block;margin-bottom:6px;}
.feature b{display:block;font-size:13px;margin-bottom:3px;}
.feature span{font-size:11.5px;color:var(--muted);line-height:1.45;display:block;}
.feature:last-child:nth-child(odd){grid-column:1/-1;}

.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dev-stage{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;}
.dev-stage b{display:block;font-size:12px;color:var(--heat);margin:4px 0 4px;}
.dev-stage span{font-size:11px;color:var(--muted);line-height:1.4;display:block;}
</style>
</head>

<script>
var _swReg=null;
function showUpdateBar(){ document.getElementById('updateBar').style.display='flex'; }
function trackInstalling(sw){
  sw.addEventListener('statechange',function(){
    if(sw.state==='installed'&&navigator.serviceWorker.controller) showUpdateBar();
  });
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    _swReg=reg;
    if(reg.waiting&&navigator.serviceWorker.controller) showUpdateBar();
    if(reg.installing) trackInstalling(reg.installing);
    reg.addEventListener('updatefound',function(){ trackInstalling(reg.installing); });
    document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') reg.update(); });
    reg.update();
  }).catch(function(){});
}
function applyUpdate(){
  document.getElementById('updateBar').style.display='none';
  var doReload=function(){ window.location.reload(); };
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('controllerchange',doReload);
    (_swReg&&_swReg.waiting ? Promise.resolve(_swReg) : navigator.serviceWorker.ready).then(function(reg){
      if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'}); else doReload();
    });
  } else { doReload(); }
}

  dev3_t:"Day 3–4", dev3_d:"The embryo splits into three germ layers (gastrulation). Wing and leg buds appear; the amniotic sac begins enclosing the embryo.",
  dev4_t:"Day 5–6", dev4_d:"Reproductive organs and sex differentiation begin. Digits and the beak start forming; the eye gains visible pigment.",
  dev5_t:"Day 7–8", dev5_d:"The neck lengthens, separating head from body. Upper and lower beak differentiate; eye pigmentation is clearly visible.",
  dev6_t:"Day 9–10", dev6_d:"Claws and the first feather follicles appear. The allantois grows rapidly; the egg tooth begins forming.",
  dev7_t:"Day 11–13", dev7_d:"Skeletal calcification begins. Scales, down and toenails appear.",
  dev8_t:"Day 14", dev8_d:"The embryo repositions, head tucked under the right wing — distinctly chick-like now.",
  dev9_t:"Day 15–17", dev9_d:"Down grows in and gains colour. Albumen is nearly used up; the beak turns toward the air cell.",
  dev10_t:"Day 18–19", dev10_d:"The yolk sac begins drawing into the body cavity; amniotic fluid falls sharply.",
  dev11_t:"Day 20", dev11_d:"Yolk fully internalised. The chick breaks into the air cell (internal pip) and takes its first breath.",
  dev12_t:"Day 21", dev12_d:"External pipping begins, followed by a slow rotation that chips a line around the shell until the cap detaches.",
  incTypesTitle:"Incubator types",
  inc_stillair_t:"Still-air", inc_stillair_d:"An insulated box with natural convection only — heat rises, so a real top-to-bottom gradient forms. Sensors sit near egg height; still-air machines typically run ~1–1.5°C warmer than the forced-draft target to compensate, and need to stay level with similarly-sized eggs.",
  inc_forceddraft_t:"Forced-draft", inc_forceddraft_d:"A circulating fan keeps temperature close to uniform throughout, so sensor placement matters less and different egg sizes can share a machine. The same airflow dries eggs faster, so humidity needs closer attention.",
  inc_contact_t:"Contact / radiant-heat", inc_contact_d:"Warms eggs through a heated surface resting on top, mimicking a parent's brood patch, lifted periodically for fresh air. Research shows this produces a real temperature gradient across the egg that shifts as the embryo grows — eggs seem to tolerate small swings a little better this way, though accurate control still matters.",
  turningTitle:"Turning mechanisms",
  turn_tilt_t:"Tilting trays", turn_tilt_d:"The most common commercial approach — eggs rock through ~80° total on a timed cycle. Efficient at scale, well suited to poultry-type eggs.",
  turn_roller_t:"Roller beds", turn_roller_d:"Eggs rest on rollers that spin as a moving floor shifts beneath them, rotating the eggs in place.",
  turn_floor_t:"Moving floors", turn_floor_d:"Eggs lie on a floor that slides side to side with fixed dividers, rolling the eggs. Works well for symmetrical eggs like duck; pointed eggs tend to bunch.",
  turn_trough_t:"Troughs / channels", turn_trough_d:"Semicircular tilting channels sized for very small eggs like quail — a more limited turning angle than the other methods.",
  humidityTitle:"Measuring humidity", humidityIntro:"Two common methods — both need some air movement to read accurately, so neither is reliable in a still-air machine; egg weight loss (below) is the better guide there.",
  hygrometer_t:"Hygrometers", hygrometer_d:"Measure humidity directly. Electronic sensors are generally more accurate than mechanical (hair) ones — check any hygrometer against a known reference before trusting it; a cheap, uncalibrated one can mislead more than having none.",
  wetbulb_t:"Wet-bulb thermometers", wetbulb_d:"A moist-wicked thermometer reads cooler than a dry one as water evaporates from the wick — the drier the air, the bigger the gap. That gap converts to a relative-humidity percentage.",
  wetbulbNote:"Conversion at a dry-bulb temperature of 37.5°C (99.5°F). At a different dry-bulb temperature the same wet-bulb reading gives a slightly different RH%.",
  weightLossTitle:"Tracking weight loss",
  weightLossText:"Weighing eggs through incubation is the most reliable way to check conditions are correct — more reliable than any single humidity reading. Most eggs need to lose around 13–15% of fresh weight by internal pipping, though some raptors and parrots run a little higher; confirm against published data or your own hatch records.",
  hoytText:"If fresh weight wasn't recorded at laying, Hoyt's (1979) formula estimates it from length (L) and breadth (B) in cm: volume ≈ 0.51 × L × B², fresh weight ≈ Kw × L × B² (Kw ≈ 0.55–0.58 for chicken-type eggs, otherwise weigh a small sample to solve for Kw). Daily target loss = (fresh weight × target %) ÷ days to internal pip.",
  hoytSource:"Source: Hoyt, D.F. (1979). \"Practical Methods of Estimating Volume and Fresh Weight of Bird Eggs.\" The Auk, 96(1), 73–77.",
  stillAirNote:"Temperature shown is for forced-draft incubators; still-air machines typically need to run ~1–1.5°C (2–3°F) warmer at egg height for the same true egg-centre temperature.",

  guide0_t:"٠ · قبل التعيين: التخزين والتعامل الصحيح", guide0_d:"احفظ البيض الخصب عند 13–18°م، رطوبة 70–80٪، بالطرف المدبب للأسفل. قلّب البيض المخزَّن بزاوية ~90° مرة أو مرتين يوميًا بعد يومين إلى ثلاثة — تنخفض قابلية الفقس بعد 7–10 أيام من التخزين. دفّئ البيض تدريجيًا لحرارة الغرفة على مدى ساعات قبل التعيين؛ فوضع بيضة باردة في حاضنة دافئة يسبب تكاثفًا، وهو طريق للتلوث.",
  guide1_t:"١ · عيّن البيض (اليوم صفر)", guide1_d:"بيض متقارب الحجم وخالٍ من الشروخ، ودافئ لدرجة حرارة الغرفة قبل التحميل. هذا هو اليوم صفر — سجّل الدفعة هنا لبدء المتابعة.",

  guide5_t:"٥ · الإغلاق — لا تلمس", guide5_d:"أوقف التقليب، ارفع الرطوبة إلى الهدف، أغلق الحاضنة واتركها مغلقة حتى الفقس. كل فتح يُخفّض الرطوبة.",

let LANG=(localStorage.getItem('ibird_lang')||'ar');
function t(key,vars){
  let s=I18N[LANG][key]||I18N.en[key]||key;
  if(vars) for(const k in vars) s=s.replace('{'+k+'}',vars[k]);
  return s;
}
function toggleLang(){
  LANG=LANG==='ar'?'en':'ar';
  localStorage.setItem('ibird_lang',LANG);
  applyLangAttrs();
  renderAll();
}
function applyLangAttrs(){
  document.documentElement.lang=LANG;
  document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
}

/* ---------- date helpers ---------- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/86400000); }
function fmtDate(iso){ if(!iso) return t('notSet'); const d=new Date(iso+'T00:00:00Z'); return d.toLocaleDateString(LANG==='ar'?'ar-BH':'en-GB',{day:'numeric',month:'short',timeZone:'UTC'}); }

/* ---------- schedule derivation (§4 of the dev plan) ---------- */
function computeSchedule(batch){
  const sp=speciesById(batch.speciesId);
  const today=todayISO();
  const dayNum=daysBetween(batch.setDate,today);
  const lockDay=sp.incubationDays-sp.lockdownOffsetDays;
  const hatchDay=sp.incubationDays;
  const hatchBufferDays=Math.ceil(sp.hatchSpreadHours/24);

  let status;
  if(batch.manualComplete) status='complete';
  else if(dayNum<lockDay) status='incubating';
  else if(dayNum<hatchDay) status='lockdown';
  else if(dayNum<hatchDay+hatchBufferDays+3) status='hatching';
  else status='complete';

  const events=[];
  events.push({key:'candling1',label:t('eventCandling1'),date:addDays(batch.setDate,sp.candlingDays[0])});
  events.push({key:'candling2',label:t('eventCandling2'),date:addDays(batch.setDate,sp.candlingDays[1])});
  events.push({key:'lockdownWarn',label:t('eventLockdownWarn'),date:addDays(batch.setDate,lockDay-1)});
  events.push({key:'lockdownDay',label:t('eventLockdownDay'),date:addDays(batch.setDate,lockDay)});
  events.push({key:'dnd',label:t('eventDND'),date:addDays(batch.setDate,lockDay+1)});
  events.push({key:'hatchWarn',label:t('eventHatchWarn'),date:addDays(batch.setDate,hatchDay-1)});
  events.push({key:'hatchStart',label:t('eventHatchStart'),date:addDays(batch.setDate,hatchDay)});
  if(batch.firstHatchAt){
    events.push({key:'chickRemoval',label:t('eventChickRemoval'),date:addDays(batch.firstHatchAt,Math.ceil(sp.chickRemovalHours/24))});
  }
  const fertileUnknownOrRemaining=(batch.eggsFertile==null)||(batch.eggsHatched==null)||(batch.eggsHatched<batch.eggsFertile);
  if(fertileUnknownOrRemaining && status!=='complete'){
    events.push({key:'stalled',label:t('eventStalled'),date:addDays(batch.setDate,hatchDay+hatchBufferDays+2)});
  }
  events.sort((a,b)=>a.date<b.date?-1:1);

  return {sp,dayNum,lockDay,hatchDay,status,events,today};
}

function metricsFor(batch){
  const m={};
  if(batch.eggsFertile!=null && batch.eggsSet>0) m.fertility=(batch.eggsFertile/batch.eggsSet*100);
  if(batch.eggsHatched!=null && batch.eggsSet>0) m.hos=(batch.eggsHatched/batch.eggsSet*100);
  if(batch.eggsHatched!=null && batch.eggsFertile>0) m.hof=(batch.eggsHatched/batch.eggsFertile*100);
  const incubator=incubators.find(i=>i.id===batch.incubatorId);
  const sp=speciesById(batch.speciesId);
  let powerCost=null;
  if(incubator && incubator.ratedPowerWatts){
    const kwh=(incubator.ratedPowerWatts/1000)*sp.incubationDays*24;
    powerCost=kwh*(settings.electricityRate||0);
  }
  m.powerCost=powerCost;
  if(batch.eggsHatched>0){
    const total=(batch.eggCostTotal||0)+(powerCost||0)+(batch.otherCosts||0);
    m.costPerChick=total/batch.eggsHatched;
  }
  return m;
}

/* ---------- Dry-Down: per-egg weight tracking (ported from the iBird Eggs project) ----------
   Target loss ramps linearly from 0% at day 0 to egg.targetLoss% at the
   pip/lockdown day — same model as the original Dry-Down app. */
function pipDay(egg){ const sp=speciesById(egg.speciesId); return sp.incubationDays-sp.lockdownOffsetDays; }
function targetLossAt(egg,day){ const p=pipDay(egg); return egg.targetLoss*Math.min(Math.max(day,0),p)/p; }
function targetWeightAt(egg,day){ return egg.fresh*(1-targetLossAt(egg,day)/100); }
function lossPct(egg,weight){ return (egg.fresh-weight)/egg.fresh*100; }

function analyseEgg(egg){
  const p=pipDay(egg);
  const elapsed=daysBetween(egg.setDate,todayISO());
  const ms=(egg.weighIns||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const last=ms.length?ms[ms.length-1]:null;
  const out={elapsed,p,targetWeightToday:targetWeightAt(egg,elapsed),targetLossToday:targetLossAt(egg,elapsed)};
  if(elapsed>=p){ out.status='lockdown'; return out; }
  if(!last){ out.status='wait'; return out; }
  const lastDay=daysBetween(egg.setDate,last.date);
  const aLoss=lossPct(egg,last.weight), tLoss=targetLossAt(egg,lastDay);
  const tol=Math.max(1.0,0.12*Math.max(tLoss,1));
  const dev=aLoss-tLoss;
  out.lastDay=lastDay; out.aLoss=aLoss; out.tLoss=tLoss; out.tol=tol; out.dev=dev; out.last=last;
  out.status=dev>tol?'fast':(dev<-tol?'slow':'ok');
  if(out.status!=='ok'){
    out.rhStep=Math.max(3,Math.min(12,Math.round(Math.abs(dev)*1.4)));
  }
  return out;
}

    <div class="modalhead"><h2>${t('newIncubator')}</h2><button class="close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>${t('incubatorName')}</label><input id="f_incName"></div>
    <div class="field"><label>${t('incubatorType')}</label>
      <select id="f_incType"><option value="manual">${t('typeManual')}</option><option value="esp32">${t('typeEsp32')}</option></select></div>
    <div class="field"><label>${t('incubatorLocation')}</label><input id="f_incLoc"></div>
    <div class="field"><label>${t('incubatorPower')}</label><input id="f_incPower" type="number" inputmode="numeric"></div>
    <button class="btn" style="margin-top:16px" onclick="saveIncubator()">${t('save')}</button>
  `);
}
function saveIncubator(){
  const name=document.getElementById('f_incName').value.trim();
  if(!name) return;
  incubators.push({
    id:uid(), name,
    type:document.getElementById('f_incType').value,
    location:document.getElementById('f_incLoc').value.trim(),
    ratedPowerWatts:parseFloat(document.getElementById('f_incPower').value)||null
  });
  saveIncubators(); closeModal(); renderAll(); toast(t('toastSaved'));
}

function openBatchModal(){
  if(incubators.length===0){ openIncubatorModal(); return; }
  const incOptions=incubators.map(i=>`<option value="${i.id}">${escapeHtml(i.name)}</option>`).join('');
  const spOptions=SPECIES.map(s=>`<option value="${s.id}">${t(s.nameKey)}</option>`).join('');
  openModal(`
    <div class="modalhead"><h2>${t('newBatch')}</h2><button class="close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>${t('batchIncubator')}</label><select id="f_batchInc">${incOptions}</select></div>
    <div class="field"><label>${t('batchSpecies')}</label><select id="f_batchSpecies">${spOptions}</select></div>
    <div class="field"><label>${t('batchSetDate')}</label><input id="f_batchDate" type="date" value="${todayISO()}"></div>
    <div class="field"><label>${t('batchEggsSet')}</label><input id="f_batchEggs" type="number" inputmode="numeric"></div>
    <div class="field"><label>${t('batchHatcherMode')}</label>
      <select id="f_batchHatcher"><option value="same_incubator">${t('hatcherSame')}</option><option value="separate_hatcher">${t('hatcherSeparate')}</option></select></div>
    <div class="field"><label>${t('batchNotes')}</label><textarea id="f_batchNotes" rows="2"></textarea></div>
    <button class="btn" style="margin-top:16px" onclick="saveBatch()">${t('save')}</button>
  `);
}
function saveBatch(){
  const eggsSet=parseInt(document.getElementById('f_batchEggs').value,10);
  if(!eggsSet||eggsSet<=0) return;
  batches.push({
    id:uid(),
    incubatorId:document.getElementById('f_batchInc').value,
    speciesId:document.getElementById('f_batchSpecies').value,
    setDate:document.getElementById('f_batchDate').value||todayISO(),
    trackingMode:'normal',
    eggsSet, eggsFertile:null, eggsHatched:null, firstHatchAt:null,
    eggCostTotal:0, otherCosts:0,
    hatcherMode:document.getElementById('f_batchHatcher').value,
    notes:document.getElementById('f_batchNotes').value.trim(),
    manualComplete:false
  });
  saveBatches(); closeModal(); renderAll(); toast(t('toastSaved'));
}

/* ---------- Egg Test List branch (§4a) ---------- */
let EGGTEST_SELECTED=null;
function candlingRefCard(){
  let html=`<div class="card"><h2>${t('candleRefTitle')}</h2>`;
  for(let i=1;i<=6;i++){
    html+=`<div class="event"><div><div class="lbl">${t('candleRef'+i+'_t')}</div><div class="muted">${t('candleRef'+i+'_d')}</div></div></div>`;
  }
  return html+`</div>`;
}
function viewEggTest(){
  if(batches.length===0) return `<div class="card"><div class="empty">${t('noBatches')}</div></div>`+candlingRefCard();
  const options=batches.map(b=>{
    const sc=computeSchedule(b);
    return `<button class="chip ${EGGTEST_SELECTED===b.id?'active':''}" onclick="selectEggTestBatch('${b.id}')">${t(sc.sp.nameKey)} · ${fmtDate(b.setDate)}</button>`;
  }).join('');
  let html=`<div class="card"><h2>${t('eggTestTitle')}</h2><div class="chip-row">${options}</div></div>`;

  const b=batches.find(x=>x.id===EGGTEST_SELECTED)||batches[0];
  if(!b) return html;
  EGGTEST_SELECTED=b.id;
  const m=metricsFor(b);

  html+=`<div class="card">
    <div class="row">
      <button class="btn ghost small" onclick="openCandleModal('${b.id}',1)">${t('candle1Btn')}</button>
      <button class="btn ghost small" onclick="openCandleModal('${b.id}',2)">${t('candle2Btn')}</button>
      <button class="btn ghost small" onclick="openHatchModal('${b.id}')">${t('hatchBtn')}</button>
    </div>
  </div>`;

  html+=`<div class="card"><h2>${t('metricsFertility')} / ${t('metricsHOS')} / ${t('metricsHOF')}</h2>
    <div class="row">
      <div class="metric"><b>${m.fertility!=null?m.fertility.toFixed(1)+'%':t('notSet')}</b><span>${t('metricsFertility')}</span></div>
      <div class="metric"><b>${m.hos!=null?m.hos.toFixed(1)+'%':t('notSet')}</b><span>${t('metricsHOS')}</span></div>
      <div class="metric"><b>${m.hof!=null?m.hof.toFixed(1)+'%':t('notSet')}</b><span>${t('metricsHOF')}</span></div>
    </div></div>`;

  html+=`<div class="card"><h2>${t('metricsCostPerChick')}</h2>
    <div class="row">
      <div class="field"><label>${t('fieldEggCost')}</label><input id="f_costEgg" type="number" value="${b.eggCostTotal||0}" onchange="updateCosts('${b.id}')"></div>
      <div class="field"><label>${t('fieldOtherCosts')}</label><input id="f_costOther" type="number" value="${b.otherCosts||0}" onchange="updateCosts('${b.id}')"></div>
    </div>
    <div class="row">
      <div class="field"><label>${t('fieldElectricityRate')}</label><input id="f_elecRate" type="number" step="0.001" value="${settings.electricityRate}" onchange="updateSettingsRate()"></div>
      <div class="field"><label>${t('fieldCurrency')}</label><input id="f_currency" value="${settings.currency}" onchange="updateSettingsCurrency()"></div>
    </div>
    <div class="note">${t('powerCostEstimate')}: ${m.powerCost!=null?ltr(m.powerCost.toFixed(2)+' '+settings.currency):t('notSet')}</div>
    <div class="metric" style="margin-top:6px"><b>${m.costPerChick!=null?ltr(m.costPerChick.toFixed(2)+' '+settings.currency):t('notSet')}</b><span>${t('metricsCostPerChick')}</span></div>
  </div>`;

  html+=candlingRefCard();
  return html;
}
function selectEggTestBatch(id){ EGGTEST_SELECTED=id; renderView(); }
function updateCosts(batchId){
  const b=batches.find(x=>x.id===batchId); if(!b) return;
  b.eggCostTotal=parseFloat(document.getElementById('f_costEgg').value)||0;
  b.otherCosts=parseFloat(document.getElementById('f_costOther').value)||0;
  saveBatches(); renderView();
}
function updateSettingsRate(){ settings.electricityRate=parseFloat(document.getElementById('f_elecRate').value)||0; saveSettings(); renderView(); }
function updateSettingsCurrency(){ settings.currency=document.getElementById('f_currency').value||'BHD'; saveSettings(); renderView(); }

function openCandleModal(batchId,round){
  const b=batches.find(x=>x.id===batchId); if(!b) return;
  const defaultVal=round===1?b.eggsSet:(b.eggsFertile!=null?b.eggsFertile:b.eggsSet);
  openModal(`
    <div class="modalhead"><h2>${round===1?t('candleModalTitle1'):t('candleModalTitle2')}</h2><button class="close" onclick="closeModal()">✕</button></div>
    <div class="muted">${round===1?t('candleHint1'):t('candleHint2')}</div>
    <div class="field"><label>${t('fieldEggsFertile')}</label><input id="f_candleFertile" type="number" inputmode="numeric" value="${defaultVal}"></div>
    <button class="btn" style="margin-top:16px" onclick="saveCandle('${b.id}')">${t('save')}</button>
  `);
}
function saveCandle(batchId){
  const b=batches.find(x=>x.id===batchId); if(!b) return;
  const v=parseInt(document.getElementById('f_candleFertile').value,10);
  if(isNaN(v)||v<0) return;
  b.eggsFertile=v;
  saveBatches(); closeModal(); renderAll(); toast(t('toastSaved'));
}
function openHatchModal(batchId){
  const b=batches.find(x=>x.id===batchId); if(!b) return;
  const defaultVal=b.eggsFertile!=null?b.eggsFertile:b.eggsSet;
  openModal(`
    <div class="modalhead"><h2>${t('hatchModalTitle')}</h2><button class="close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>${t('fieldEggsHatched')}</label><input id="f_hatched" type="number" inputmode="numeric" value="${b.eggsHatched!=null?b.eggsHatched:defaultVal}"></div>
    <div class="field"><label>${t('fieldFirstHatchDate')}</label><input id="f_firstHatch" type="date" value="${b.firstHatchAt||todayISO()}"></div>
    <button class="btn" style="margin-top:16px" onclick="saveHatch('${b.id}')">${t('save')}</button>
  `);
}
function saveHatch(batchId){
  const b=batches.find(x=>x.id===batchId); if(!b) return;
  const v=parseInt(document.getElementById('f_hatched').value,10);
  if(isNaN(v)||v<0) return;
  b.eggsHatched=v;
  b.firstHatchAt=document.getElementById('f_firstHatch').value||todayISO();
  saveBatches(); closeModal(); renderAll(); toast(t('toastSaved'));
}

/* ---------- Dry-Down branch: per-egg weight tracking ---------- */
function viewDrydown(){
  let html=`<div class="card"><h2>${t('drydownTitle')}</h2><div class="muted" style="margin-bottom:12px">${t('drydownIntro')}</div>
    <button class="btn ghost small" onclick="openEggModal()">+ ${t('newEgg')}</button></div>`;

  if(eggs.length===0){
    html+=`<div class="card"><div class="empty">${t('noEggs')}</div></div>`;
    return html;
  }

  eggs.forEach(egg=>{
    const a=analyseEgg(egg);
    const sp=speciesById(egg.speciesId);
    html+=`<div class="batch" onclick="openEggDetail('${egg.id}')">
      <div class="top">
        <div class="name">${escapeHtml(egg.label)}</div>
        <span class="pill ${a.status}">${t('status'+(a.status==='lockdown'?'LockdownEgg':a.status.charAt(0).toUpperCase()+a.status.slice(1)))}</span>
      </div>
      <div class="meta">${t(sp.nameKey)} · ${t('dayOfPip',{d:Math.max(a.elapsed,0),p:a.p})}</div>
      ${egg.batchId&&batches.find(x=>x.id===egg.batchId)?`<div class="meta">🔗 ${t('linkedBatch')}: ${fmtDate(batches.find(x=>x.id===egg.batchId).setDate)}</div>`:''}
      <div class="stats">
        <div><b>${egg.fresh}</b><span>${LANG==='ar'?'الوزن الطازج':'fresh (g)'}</span></div>
        <div><b>${a.last?a.last.weight.toFixed(1):t('notSet')}</b><span>${t('currentWeight')}</span></div>
        <div><b>${a.aLoss!=null?a.aLoss.toFixed(1)+'%':t('notSet')}</b><span>${t('lostSoFar')}</span></div>
      </div>
    </div>`;
  });
  return html;
}

function openEggModal(presetBatchId){
  const spOptions=SPECIES.map(s=>`<option value="${s.id}">${t(s.nameKey)}</option>`).join('');
  const batchOptions=`<option value="">${t('noneOption')}</option>`+batches.map(b=>{
    const sp=speciesById(b.speciesId);
    return `<option value="${b.id}" ${b.id===presetBatchId?'selected':''}>${t(sp.nameKey)} · ${fmtDate(b.setDate)}</option>`;
  }).join('');
  const preset=presetBatchId?batches.find(b=>b.id===presetBatchId):null;
  openModal(`
    <div class="modalhead"><h2>${t('newEgg')}</h2><button class="close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>${t('eggLabel')}</label><input id="f_eggLabel"></div>
    <div class="field"><label>${t('linkedBatch')}</label><select id="f_eggBatch">${batchOptions}</select></div>
    <div class="field"><label>${t('batchSpecies')}</label><select id="f_eggSpecies">${spOptions}</select></div>
    <div class="row">
      <div class="field"><label>${t('eggFreshWeight')}</label><input id="f_eggFresh" type="number" step="0.1" inputmode="decimal"></div>
      <div class="field"><label>${t('eggTargetLoss')}</label><input id="f_eggTarget" type="number" step="0.5" value="13" inputmode="decimal"></div>
    </div>
    <div class="field"><label>${t('batchSetDate')}</label><input id="f_eggDate" type="date" value="${preset?preset.setDate:todayISO()}"></div>
    <div class="field"><label>${t('batchHatcherMode')}</label>
      <select id="f_eggHatcher"><option value="same_incubator">${t('hatcherSame')}</option><option value="separate_hatcher">${t('hatcherSeparate')}</option></select></div>
    <button class="btn" style="margin-top:16px" onclick="saveEgg()">${t('save')}</button>
  `);
  if(preset){
    document.getElementById('f_eggSpecies').value=preset.speciesId;
    document.getElementById('f_eggHatcher').value=preset.hatcherMode;
    document.getElementById('f_eggTarget').value=defaultTargetLoss(speciesById(preset.speciesId));
  }
  document.getElementById('f_eggSpecies').addEventListener('change',function(){
    document.getElementById('f_eggTarget').value=defaultTargetLoss(speciesById(this.value));
  });
  document.getElementById('f_eggBatch').addEventListener('change',function(){
    const b=batches.find(x=>x.id===this.value);
    if(!b) return;
    document.getElementById('f_eggSpecies').value=b.speciesId;
    document.getElementById('f_eggHatcher').value=b.hatcherMode;
    document.getElementById('f_eggDate').value=b.setDate;
    document.getElementById('f_eggTarget').value=defaultTargetLoss(speciesById(b.speciesId));
  });
}
function saveEgg(){
  const label=document.getElementById('f_eggLabel').value.trim();
  const fresh=parseFloat(document.getElementById('f_eggFresh').value);
  if(!label||!fresh||fresh<=0) return;
  const batchId=document.getElementById('f_eggBatch').value||null;
  eggs.push({
    id:uid(), label, batchId,
    speciesId:document.getElementById('f_eggSpecies').value,
    fresh, targetLoss:parseFloat(document.getElementById('f_eggTarget').value)||13,
    setDate:document.getElementById('f_eggDate').value||todayISO(),
    hatcherMode:document.getElementById('f_eggHatcher').value,
    weighIns:[]
  });
  saveEggs(); closeModal(); renderAll(); toast(t('toastSaved'));
}

function openEggDetail(eggId){
  const egg=eggs.find(x=>x.id===eggId); if(!egg) return;
  const a=analyseEgg(egg);
  let msg='';
  if(a.status==='lockdown') msg=t(egg.hatcherMode==='separate_hatcher'?'msgLockSep':'msgLockSame',{p:a.p});
  else if(a.status==='wait') msg=t('msgWait',{w:a.targetWeightToday.toFixed(2),l:a.targetLossToday.toFixed(1)});
  else if(a.status==='ok') msg=t('msgOk',{s:(a.dev>=0?'+':'')+a.dev.toFixed(1)});
  else msg=t(a.status==='fast'?'msgFast':'msgSlow',{o:Math.abs(a.dev).toFixed(1),step:a.rhStep});

  const rows=(egg.weighIns||[]).slice().sort((x,y)=>x.date<y.date?1:-1).map(m=>{
    const d=daysBetween(egg.setDate,m.date), tl=targetLossAt(egg,d), al=lossPct(egg,m.weight);
    return `<tr><td>${LANG==='ar'?'يوم':'day'} ${d} · ${fmtDate(m.date)}</td><td>${m.weight}g</td><td>${al.toFixed(1)}% (${(al-tl>=0?'+':'')}${(al-tl).toFixed(1)})</td></tr>`;
  }).join('');

  openModal(`
    <div class="modalhead"><h2>${escapeHtml(egg.label)}</h2><div class="muted">${t(speciesById(egg.speciesId).nameKey)} · ${t('dayOfPip',{d:Math.max(a.elapsed,0),p:a.p})}</div>
      <button class="close" onclick="closeModal()">✕</button></div>
    <div class="card" style="background:rgba(0,0,0,.2)"><span class="pill ${a.status}">${t('status'+(a.status==='lockdown'?'LockdownEgg':a.status.charAt(0).toUpperCase()+a.status.slice(1)))}</span>
      <div style="margin-top:10px">${msg}</div>
      ${a.status!=='lockdown'&&a.status!=='wait'?`<div class="note">${t('rhPrincipleNote')}</div>`:''}
    </div>
    <div class="row" style="margin:14px 0">
      <div class="metric"><b>${a.last?a.last.weight.toFixed(1):t('notSet')}</b><span>${t('currentWeight')}</span></div>
      <div class="metric"><b>${a.aLoss!=null?a.aLoss.toFixed(1)+'%':t('notSet')}</b><span>${t('lostSoFar')}</span></div>
      <div class="metric"><b>${a.targetWeightToday.toFixed(1)}</b><span>${t('targetToday')}</span></div>
    </div>
    <button class="btn ghost small" onclick="openWeighInModal('${egg.id}')">+ ${t('addWeighIn')}</button>
    ${rows?`<table style="margin-top:14px">${rows}</table>`:''}
    <button class="btn danger" style="margin-top:14px" onclick="deleteEgg('${egg.id}')">${t('delete')}</button>
  `);
}
function openWeighInModal(eggId){
  openModal(`
    <div class="modalhead"><h2>${t('addWeighIn')}</h2><button class="close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>${t('weighInWeight')}</label><input id="f_weighWeight" type="number" step="0.1" inputmode="decimal"></div>
    <div class="field"><label>${t('weighInDate')}</label><input id="f_weighDate" type="date" value="${todayISO()}"></div>
    <button class="btn" style="margin-top:16px" onclick="saveWeighIn('${eggId}')">${t('save')}</button>
  `);
}
function saveWeighIn(eggId){
  const egg=eggs.find(x=>x.id===eggId); if(!egg) return;
  const w=parseFloat(document.getElementById('f_weighWeight').value);
  if(!w||w<=0) return;
  egg.weighIns=egg.weighIns||[];
  egg.weighIns.push({id:uid(),weight:w,date:document.getElementById('f_weighDate').value||todayISO()});
  saveEggs(); openEggDetail(eggId); toast(t('toastSaved'));
}
function deleteEgg(eggId){
  if(!confirm(t('confirmDelete'))) return;
  eggs=eggs.filter(e=>e.id!==eggId); saveEggs(); closeModal(); renderAll(); toast(t('toastDeleted'));
}

/* ---------- Guidance branch (§1a #2, §5a) ---------- */
function viewGuidance(){
  let html=`<div class="card"><h2>${t('guideTitle')}</h2><div class="muted" style="margin-bottom:6px">${t('guideIntro')}</div>
    <div class="event"><div><div class="lbl">${t('guide0_t')}</div><div class="muted">${t('guide0_d')}</div></div></div>`;
  for(let i=1;i<=7;i++){
    html+=`<div class="event"><div><div class="lbl">${t('guide'+i+'_t')}</div><div class="muted">${t('guide'+i+'_d')}</div></div></div>`;
  }
  html+=`</div>`;

  html+=`<div class="card"><h2>${t('guidanceHeader')}</h2>`;
  const todayIso=todayISO();
  let anyToday=false;
  batches.filter(b=>!b.manualComplete).forEach(b=>{
    const sc=computeSchedule(b);
    const todaysEvents=sc.events.filter(ev=>ev.date===todayIso);
    if(todaysEvents.length===0) return;
    anyToday=true;
    const sp=sc.sp;
    todaysEvents.forEach(ev=>{
      const guideKey='guidance_'+({candling1:'candle',candling2:'candle',lockdownWarn:'lockdownWarn',lockdownDay:'lockdownDay',dnd:'dnd',hatchWarn:'hatchWarn',hatchStart:'hatchStart',chickRemoval:'removal',stalled:'stalled'}[ev.key]||'incubating');
      html+=`<div class="batch" onclick="openBatchDetail('${b.id}')">
        <div class="top"><div class="name">${t(sp.nameKey)}</div><span class="pill ${sc.status}">${ev.label}</span></div>
        <div class="meta">${t(guideKey)}</div>
      </div>`;
    });
  });
  if(!anyToday) html+=`<div class="muted">${t('guidanceEmpty')}</div>`;
  html+=`</div>`;

  html+=`<div class="card"><h2>${t('troubleshootTitle')}</h2>
    <div class="event"><div><div class="lbl">${t('tr_lowFertility_t')}</div><div class="muted">${t('tr_lowFertility_d')}</div></div></div>
    <div class="event"><div><div class="lbl">${t('tr_lowHOF_t')}</div><div class="muted">${t('tr_lowHOF_d')}</div></div></div>
    <div class="event"><div><div class="lbl">${t('tr_stalled_t')}</div><div class="muted">${t('tr_stalled_d')}</div></div></div>
    <div class="event"><div><div class="lbl">${t('tr_tempSpike_t')}</div><div class="muted">${t('tr_tempSpike_d')}</div></div></div>
    <div class="note">${t('tr_principle')}</div>
  </div>`;

  html+=`<div class="card"><h2>${t('problemsTitle')}</h2><div class="muted" style="margin-bottom:6px">${t('problemsIntro')}</div>`;
  for(let i=1;i<=12;i++){
    html+=`<div class="event"><div><div class="lbl">${t('prob'+i+'_t')}</div><div class="muted">${t('prob'+i+'_d')}</div></div></div>`;
  }
  html+=`</div>`;

  html+=notifCard();
  return html;
}

/* ---------- Info branch (§7) ---------- */
function viewInfo(){
  let html=`<div class="card"><h2>${t('infoTitle')}</h2><div class="muted">${t('infoIntro')}</div></div>`;

  html+=`<div class="card"><h2>${t('principlesTitle')}</h2><div class="muted" style="margin-bottom:6px">${t('principlesIntro')}</div>`;
  ['temp','turn','humidity','gas','clean'].forEach(k=>{
    html+=`<div class="event"><div><div class="lbl">${t('principle_'+k+'_t')}</div><div class="muted">${t('principle_'+k+'_d')}</div></div></div>`;
  });
  html+=`<div class="note">${t('altricialNote')}</div></div>`;

  html+=`<div class="card"><h2>${t('devTitle')}</h2><div class="muted" style="margin-bottom:10px">${t('devIntro')}</div>
    <div class="dev-grid">`;
  const fracs=[0.05,0.10,0.17,0.26,0.36,0.45,0.57,0.67,0.76,0.88,0.95,1];
  for(let i=1;i<=12;i++){
    html+=`<div class="dev-stage">${eggIllustration(fracs[i-1])}<b>${t('dev'+i+'_t')}</b><span>${t('dev'+i+'_d')}</span></div>`;
  }
  html+=`</div></div>`;

  html+=`<div class="card"><h2>${t('incTypesTitle')}</h2>`;
  ['stillair','forceddraft','contact'].forEach(k=>{
    html+=`<div class="event"><div><div class="lbl">${t('inc_'+k+'_t')}</div><div class="muted">${t('inc_'+k+'_d')}</div></div></div>`;
  });
  html+=`</div>`;

  html+=`<div class="card"><h2>${t('turningTitle')}</h2>`;
  ['tilt','roller','floor','trough'].forEach(k=>{
    html+=`<div class="event"><div><div class="lbl">${t('turn_'+k+'_t')}</div><div class="muted">${t('turn_'+k+'_d')}</div></div></div>`;
  });
  html+=`</div>`;

  html+=`<div class="card"><h2>${t('speciesTitle')}</h2>`;
  ['poultry','waterfowl','parrot','raptor','ratite'].forEach(cat=>{
    const rows=SPECIES.filter(s=>s.category===cat);
    html+=`<div class="set-label" style="margin-top:14px">${t(CATEGORY_META[cat].catNameKey)}</div>
    <table>
      <tr><th>${t('colSpecies')}</th><th>${t('colDays')}</th><th>${t('colTemp')}</th><th>${t('colHumidity')}</th></tr>
      ${rows.map(sp=>`<tr onclick="openSpeciesDetail('${sp.id}')" style="cursor:pointer">
        <td>${t(sp.nameKey)}</td><td>${ltr(speciesDaysLabel(sp))}</td><td>${ltr(sp.temp)}</td><td>${ltr(sp.humMain)}</td>
      </tr>`).join('')}
    </table>`;
  });
  html+=`</div>`;

  html+=`<div class="card"><h2>${t('humidityTitle')}</h2><div class="muted" style="margin-bottom:6px">${t('humidityIntro')}</div>
    <div class="event"><div><div class="lbl">${t('hygrometer_t')}</div><div class="muted">${t('hygrometer_d')}</div></div></div>
    <div class="event"><div><div class="lbl">${t('wetbulb_t')}</div><div class="muted">${t('wetbulb_d')}</div></div></div>
    <table style="margin-top:10px">
      <tr><th>${t('colRH')}</th><th>${t('colWetC')}</th><th>${t('colWetF')}</th></tr>
      ${[[20,21.6,70.9],[30,24.2,75.5],[40,26.5,79.8],[50,28.7,83.7],[60,30.7,87.3],[70,32.6,90.7],[80,34.3,93.8],[90,36.0,96.7],[100,37.5,99.5]]
        .map(r=>`<tr><td>${ltr(r[0]+'%')}</td><td>${ltr(r[1].toFixed(1))}</td><td>${ltr(r[2].toFixed(1))}</td></tr>`).join('')}
    </table>
    <div class="note">${t('wetbulbNote')}</div>
  </div>`;

  html+=`<div class="card"><h2>${t('weightLossTitle')}</h2>
    <div class="muted">${t('weightLossText')}</div>
    <div class="note" style="margin-top:10px">${t('hoytText')}</div>
    <div class="note">${t('hoytSource')}</div>
  </div>`;

  html+=`<div class="note" style="padding:0 4px">${t('infoSourceNote')}</div>`;
  return html;
}
function openSpeciesDetail(id){
  const sp=speciesById(id);
  openModal(`
    <div class="modalhead"><h2>${t(sp.nameKey)}</h2><div class="muted">${t(CATEGORY_META[sp.category].catNameKey)}</div>
      <button class="close" onclick="closeModal()">✕</button></div>
    <table>
      <tr><td class="muted">${t('infoIncubationDays')}</td><td>${ltr(speciesDaysLabel(sp))} ${LANG==='ar'?'يوم':'days'}</td></tr>
      <tr><td class="muted">${t('infoTempForced')}</td><td>${ltr(sp.temp)}</td></tr>
      <tr><td class="muted">${t('infoHumidityPre')}</td><td>${ltr(sp.humMain)}</td></tr>
      <tr><td class="muted">${t('infoHumidityLock')}</td><td>${ltr(sp.humHatch)}</td></tr>
      <tr><td class="muted">${t('infoTurning')}</td><td>${t(sp.altricial?'turning_altricial':'turning_precocial')}</td></tr>
      <tr><td class="muted">${t('infoLockdownOffset')}</td><td>${t('daysBeforeHatch',{n:sp.lockdownOffsetDays})}</td></tr>
      <tr><td class="muted">${t('infoCandlingDays')}</td><td>${LANG==='ar'?'اليوم':'day'} ${ltr(sp.candlingDays[0]+', '+sp.candlingDays[1])}</td></tr>
    </table>
    <div class="note">${t('stillAirNote')}</div>
  `);
}

/* ---------- Store branch (§1a #5) ---------- */
function viewStore(){
  let html=`<div class="card"><h2>${t('storeTitle')}</h2><div class="muted">${t('storeDesc')}</div></div>`;

  html+=`<div class="feature-grid">`;
  STORE_CATEGORIES.forEach(c=>{
    html+=`<a class="feature" style="text-decoration:none;color:inherit;display:block" href="${c.url}" target="_blank" rel="noopener">
      <span class="ic">${c.ic}</span><b>${LANG==='ar'?c.ar:c.en}</b></a>`;
  });
  html+=`</div>`;

  html+=`<div class="card"><h2>${t('storeFeatured')}</h2>`;
  STORE_PRODUCTS.forEach(p=>{
    html+=`<div class="event"><div><div class="lbl">${LANG==='ar'?p.ar:p.en}</div><div class="muted">${ltr(p.price+' '+settings.currency)}</div></div>
      <a class="btn ghost small" style="text-decoration:none" href="${p.url}" target="_blank" rel="noopener">→</a></div>`;
  });
  html+=`</div>`;

  html+=`<div class="card"><h2>${t('storeMoreCategories')}</h2><div class="chip-row">`;
  STORE_MORE.forEach(c=>{
    html+=`<a class="chip" style="text-decoration:none" href="${c.url}" target="_blank" rel="noopener">${LANG==='ar'?c.ar:c.en}</a>`;
  });
  html+=`</div></div>`;

  html+=`<a class="btn" style="margin-bottom:14px;text-decoration:none;display:flex" href="${STORE_URL}" target="_blank" rel="noopener">${t('storeGoBtn')}</a>`;
  return html;
}

/* ---------- best-effort local notifications ---------- */
function notifCard(){
  const perm=('Notification' in window)?Notification.permission:'unsupported';
  let btn='';
  if(perm==='granted') btn=`<span class="pill hatching">${t('notifEnabled')}</span>`;
  else if(perm==='denied') btn=`<div class="muted">${t('notifDenied')}</div>`;
  else btn=`<button class="btn ghost small" onclick="requestNotifPermission()">${t('notifEnable')}</button>`;
  return `<div class="card"><h2>🔔</h2>${btn}<div class="note">${t('notifLimitationNote')}</div></div>`;
}
function requestNotifPermission(){
  if(!('Notification' in window)) return;
  Notification.requestPermission().then(()=>renderView());
}
function checkDueNotifications(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const todayIso=todayISO();
  const shown=load('ibird_notif_shown',{});
  batches.filter(b=>!b.manualComplete).forEach(b=>{
    const sc=computeSchedule(b);
    sc.events.filter(ev=>ev.date===todayIso).forEach(ev=>{
      const key=b.id+'_'+ev.key+'_'+ev.date;
      if(shown[key]) return;
      try{ new Notification(t('appTitle'),{body:ev.label,icon:'./icons/icon-192.png'}); }catch(e){}
      shown[key]=true;
    });
  });
  save('ibird_notif_shown',shown);
}

/* ---------- modal / toast helpers ---------- */
function openModal(html){
  document.getElementById('modalBody').innerHTML=html;
  document.getElementById('modalwrap').classList.add('open');
}
function closeModal(){ document.getElementById('modalwrap').classList.remove('open'); }
document.getElementById('modalwrap').addEventListener('click',(e)=>{ if(e.target.id==='modalwrap') closeModal(); });
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}
function ltr(s){ return `<span dir="ltr" style="unicode-bidi:isolate">${s}</span>`; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- init ---------- */
applyLangAttrs();
renderAll();
checkDueNotifications();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkDueNotifications(); });
</script>
